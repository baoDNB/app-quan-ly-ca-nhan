<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f3eb" />
  <title>Nhà — Quản lý cá nhân</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#time" aria-label="Trang quản lý cá nhân">
        <span class="brand-mark">N</span>
        <span><strong>Nhà</strong><small>Không gian của bạn</small></span>
      </a>
      <nav class="module-nav" aria-label="Chọn ứng dụng">
        <button class="nav-item" type="button" data-module="time"><span class="nav-icon" aria-hidden="true">◷</span><span>Thời gian</span></button>
        <button class="nav-item" type="button" data-module="notes"><span class="nav-icon" aria-hidden="true">✦</span><span>Ghi chú</span></button>
        <button class="nav-item" type="button" data-module="expenses"><span class="nav-icon" aria-hidden="true">₫</span><span>Chi tiêu</span></button>
      </nav>
      <div class="account-area">
        <div class="today" id="today" aria-label="Ngày hôm nay"></div>
        <span class="sync-status" id="sync-status" aria-live="polite">Chưa đồng bộ</span>
        <button class="account-button" id="account-button" type="button">Đăng nhập Google</button>
      </div>
    </header>
    <main class="workspace">
      <div class="loading" id="loading" aria-live="polite"><span></span><p>Đang mở ứng dụng…</p></div>
      <iframe id="app-frame" title="Ứng dụng quản lý cá nhân"></iframe>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
